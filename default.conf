
server {
	listen 80;
        listen 443 ssl http2;

	server_name pages.fisgeo.unipg.it;
	root /usr/share/nginx/html;

        ssl_certificate /etc/ssl/certs/nginx/pages.fisgeo.unipg.it/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/nginx/pages.fisgeo.unipg.it/privkey.pem;

	charset UTF-8;

	access_log off;
	log_not_found off;
	error_log /var/log/nginx/error.log error;
}

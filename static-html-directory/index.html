<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisGeo Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        .logo {
            display: inline-block;
        }

        .logo-text {
            font-size: 3.5rem;
            font-weight: 300;
            color: #8B1538;
            letter-spacing: 0.05em;
            margin: 0;
            padding: 1rem 0;
            position: relative;
        }

        .logo-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8B1538, transparent);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            font-weight: 300;
            margin-top: 2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.5rem;
            }
            
            .container {
                padding: 2rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1 class="logo-text">fisgeo pages</h1>
            <p class="subtitle">Dipartimento di Fisica e Geologia2</p>
        </div>
    </div>
</body>
</html>
